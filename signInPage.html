<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oleo+Script:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Quicksand:wght@300..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: url('Assets/images/drinks-glasses-new-year-eve-celebration.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: -2;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            color: #fff; /* Optional: subtle blur behind */
        }

        .auth-container h3 {
            font-family: "Oleo Script", system-ui;
            font-weight: 700;
            font-style: normal;
        }

        .form-label {
            color: #fff;
            font-weight: 500;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
        }

        .btn-login {
            background-color: #e67e22;
            border: none;
            padding: 10px;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            transition: all 0.3s ease-in-out;
        }

        .btn-login:hover {
            background-color: #ff922b;
            transform: scale(1.05);
        }


        .form-label {
            color: #fff;
            font-weight: 500;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
        }

    </style>
</head>

<body>
<div class="auth-container">
    <!-- Login Form -->
    <div id="loginForm">
        <h3 class="text-center mb-4 ">Welcome to Golden Spoon</h3>
        <form>
            <div class="mb-3">
                <label for="loginName" class="form-label">User Name</label>
                <input type="text" class="form-control" id="loginName" placeholder="Enter your user name" required>
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Create a password" required>
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" value="" id="showPasswordCheck">
                    <label class="form-check-label text-white" for="showPasswordCheck">
                        Show Password
                    </label>
                </div>
            </div>
            <div class="mt-6 text-end">
                <a href="forgotPassword.html" class="text-warning" style="font-size: 0.9rem;">Forgot Password?</a>
            </div>
            <button type="button" class="btn btn-login w-100" id="signIn">Login</button>
            <p class="text-center mt-3">Don't have an account? <a href="signUpPage.html">Sign Up</a></p>
        </form>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $('#signIn').on('click', function () {
        var username = $('#loginName').val();
        var password = $('#loginPassword').val();

        if (username && password) {
            $.ajax({
                method: 'POST',
                url: 'http://localhost:8080/auth/login',
                contentType: 'application/json',
                data: JSON.stringify({
                    username: username,
                    password: password
                }),
                success: function(response) {
                    console.log("Login API Response:", response); // debug

                    const token = response.data?.accessToken;
                    if (token) {
                        // Save to localStorage
                        localStorage.setItem('username', username);
                        localStorage.setItem('token', token);

                        $.ajax({
                            method: 'GET',
                            url: 'http://localhost:8080/role/api/user-info',
                            headers: {
                                'Authorization': 'Bearer ' + token
                            },
                            success: function(userInfo) {
                                const role = userInfo.role;
                                if (role === 'ADMIN') {
                                    console.log("ADMIN Token:", token);
                                    alert('Successfully Login Admin');
                                    window.location.href = 'admin/adminDashBoard.html';
                                } else if (role === 'USER') {
                                    console.log("USER Token:", token);
                                    alert('Successfully Login User');
                                    window.location.href = 'index.html';
                                } else {
                                    alert('Unknown user role!');
                                }
                            },
                            error: function () {
                                alert('Session expired or unauthorized');
                            }
                        });
                    } else {
                        alert('Login failed: No token received');
                    }
                },
                error: function (xhr) {
                    let errorMessage = xhr.responseJSON?.message || 'Login failed. Please check your username and password.';
                    alert(errorMessage);
                }
            });
        } else {
            alert('Please enter both username and password');
        }
    });

    $('#showPasswordCheck').on('change', function() {
        let passwordField = $('#loginPassword');
        if ($(this).is(':checked')) {
            passwordField.attr('type', 'text');
        } else {
            passwordField.attr('type', 'password');
        }
    });
</script>

</body>
</html>
