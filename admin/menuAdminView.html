<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Menu Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<section class="container">

  <!-- Add Menu Item Button -->
  <div class="text-end mb-3">
    <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#menuModal">
      + Add New Menu Item
    </button>
  </div>

  <!-- Menu Items Table -->
  <div class="table-responsive shadow-sm rounded-4">
    <table class="table table-striped table-hover align-middle mb-0">
      <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Image</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price (Rs.)</th>
        <th class="text-center">Actions</th>
      </tr>
      </thead>
      <tbody id="menuTableBody">
      <!-- JS will populate rows -->
      </tbody>
    </table>
  </div>
</section>

<!-- Modal Form -->
<div class="modal fade" id="menuModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 shadow-lg border-0">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="menuModalLabel">Add Menu Item</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form id="menuForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Menu Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter item name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3" placeholder="Enter item description" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Price (Rs.)</label>
            <input type="number" step="0.01" class="form-control" name="price" placeholder="Enter price" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Upload Image</label>
            <input type="file" class="form-control" name="image" accept="image/*" required>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="menuForm" class="btn btn-primary">Save Item</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
