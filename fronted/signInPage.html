<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>sign in page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oleo+Script:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Quicksand:wght@300..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/signIn.css">

    <style>





    </style>
</head>

<body>
<div class="auth-container">
    <!-- Login Form -->
    <div id="loginForm">
        <h3 class="text-center mb-4 ">Welcome to Golden Spoon</h3>
        <form>
            <div class="mb-3">
                <label for="loginName" class="form-label">User Name</label>
                <input type="text" class="form-control" id="loginName" placeholder="Enter your user name" required>
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Create a password" required>
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" value="" id="showPasswordCheck">
                    <label class="form-check-label text-white" for="showPasswordCheck">
                        Show Password
                    </label>
                </div>
            </div>
            <div class="text-end mt-2">
                <a href="forgetPassword.html" class="forgot-password-link">
                    Forgot your password?
                </a>
            </div>

            <button type="button" class="btn btn-login w-100" id="signIn">Login</button>

            <br>
            <br>

            <div id="g_id_onload"
                 data-client_id="843649549532-umngqm8vcsrsssuds6ou4uqrfpdn419k.apps.googleusercontent.com"
                 data-login_uri="http://localhost:63342/rms-springboot-application/rms-springboot-backend/fronted/index.html"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="circle"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-size="large">
            </div>



            <p class="text-center mt-3">Don't have an account? <a href="signUpPage.html">Sign Up</a></p>

        </form>
    </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/signIn.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
