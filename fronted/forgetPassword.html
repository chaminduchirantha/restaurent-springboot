<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .forgot-box {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 380px;
    }
    .alert-message {
      display: none;
    }
  </style>
</head>
<body>
<div class="forgot-box">
  <h4 class="text-center mb-3">Forgot Password</h4>
  <p class="text-muted text-center">Enter your email to reset your password</p>

  <div id="alert-msg" class="alert alert-danger alert-message" role="alert"></div>

  <div id="email-section">
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>
    <button type="button" id="forgot-btn" class="btn btn-warning w-100">Send OTP</button>
  </div>

  <div id="otp-section" style="display:none;">
    <div class="mb-3 mt-3">
      <label for="otp" class="form-label">Enter OTP</label>
      <input type="text" class="form-control" id="otp" placeholder="Enter OTP received in your email">
    </div>
    <button type="button" id="verify-btn" class="btn btn-primary w-100">Verify OTP</button>
  </div>

  <div id="reset-section" style="display:none;">
    <div class="mb-3 mt-3">
      <label for="newPassword" class="form-label">New Password</label>
      <input type="password" class="form-control" id="newPassword" placeholder="Enter new password">
    </div>
    <button type="button" id="reset-btn" class="btn btn-success w-100">Reset Password</button>
  </div>

  <div class="mt-3 text-center">
    <a href="signInPage.html">Back to Login</a>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  const BASE_URL = "http://localhost:8080/auth";

  function showAlert(message) {
    const alertBox = $("#alert-msg");
    alertBox.text(message).show();
    setTimeout(() => alertBox.hide(), 5000); // Hide after 5 seconds
  }

  // Step 1: Send OTP
  $("#forgot-btn").on("click", function () {
    const email = $("#email").val();
    if (!email) {
      showAlert("Please enter your email!");
      return;
    }

    $.ajax({
      url: BASE_URL + "/forgot-password",
      type: "POST",
      contentType: "application/json",
      data: JSON.stringify({ email: email }),
      success: function (res) {
        alert(res.message); // Using alert for success confirmation
        $("#email-section").hide();
        $("#otp-section").show();
      },
      error: function (xhr) {
        showAlert(xhr.responseJSON.message || "An unknown error occurred.");
      }
    });
  });

  // Step 2: Verify OTP
  $("#verify-btn").on("click", function () {
    const email = $("#email").val();
    const otp = $("#otp").val();
    if (!otp) {
      showAlert("Please enter the OTP!");
      return;
    }

    $.ajax({
      url: BASE_URL + "/verify-otp",
      type: "POST",
      contentType: "application/json",
      data: JSON.stringify({ email: email, otp: otp }),
      success: function (res) {
        alert(res.message);
        $("#otp-section").hide();
        $("#reset-section").show();
      },
      error: function (xhr) {
        showAlert(xhr.responseJSON.message || "An unknown error occurred.");
      }
    });
  });

  // Step 3: Reset Password
  $("#reset-btn").on("click", function () {
    const email = $("#email").val();
    const otp = $("#otp").val();
    const newPassword = $("#newPassword").val();

    if (!newPassword) {
      showAlert("Please enter a new password!");
      return;
    }

    $.ajax({
      url: BASE_URL + "/reset-password",
      type: "POST",
      contentType: "application/json",
      data: JSON.stringify({ email: email, otp: otp, newPassword: newPassword }),
      success: function (res) {
        alert(res.message);
        window.location.href = "signInPage.html";
      },
      error: function (xhr) {
        showAlert(xhr.responseJSON.message || "An unknown error occurred.");
      }
    });
  });
</script>
</body>
</html>
