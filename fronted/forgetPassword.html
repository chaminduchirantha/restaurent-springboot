<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .forgot-box {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 350px;
    }
  </style>
</head>
<body>
<div class="forgot-box">
  <h4 class="text-center mb-3">Forgot Password</h4>
  <p class="text-muted text-center">Enter your email to reset your password</p>

  <!-- Step 1: Email input -->
  <div id="email-section">
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>
    <button type="button" id="forgot-btn" class="btn btn-warning w-100">Send OTP</button>
  </div>

  <!-- Step 2: OTP input (hidden by default) -->
  <div id="otp-section" style="display:none;">
    <div class="mb-3 mt-3">
      <label for="otp" class="form-label">Enter OTP</label>
      <input type="text" class="form-control" id="otp" placeholder="Enter OTP">
    </div>
    <button type="button" id="verify-btn" class="btn btn-primary w-100">Verify OTP</button>
  </div>

  <!-- Step 3: New password (hidden by default) -->
  <div id="reset-section" style="display:none;">
    <div class="mb-3 mt-3">
      <label for="newPassword" class="form-label">New Password</label>
      <input type="password" class="form-control" id="newPassword" placeholder="Enter new password">
    </div>
    <button type="button" id="reset-btn" class="btn btn-success w-100">Reset Password</button>
  </div>

  <div class="mt-3 text-center">
    <a href="signInPage.html">Back to Login</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  const BASE_URL = "http://localhost:8080/auth";

  // Step 1: Send OTP
  $("#forgot-btn").on("click", function () {
    const email = $("#email").val();
    if (!email) {
      alert("Please enter your email!");
      return;
    }
    $.ajax({
      url: BASE_URL + "/forgot-password",
      type: "POST",
      data: { email: email },
      success: function (res) {
        alert(res.message);
        $("#otp-section").show();   // Show OTP input
      },
      error: function (xhr) {
        alert("Error: " + xhr.responseJSON.message);
      }
    });
  });

  // Step 2: Verify OTP
  $("#verify-btn").on("click", function () {
    const email = $("#email").val();
    const otp = $("#otp").val();
    if (!otp) {
      alert("Please enter OTP!");
      return;
    }
    $.ajax({
      url: BASE_URL + "/verify-otp",
      type: "POST",
      data: { email: email, otp: otp },
      success: function (res) {
        alert(res.message);
        $("#reset-section").show();  // Show reset password section
      },
      error: function (xhr) {
        alert("Error: " + xhr.responseJSON.message);
      }
    });
  });

  // Step 3: Reset Password
  $("#reset-btn").on("click", function () {
    const email = $("#email").val();
    const otp = $("#otp").val();
    const newPassword = $("#newPassword").val();

    if (!newPassword) {
      alert("Please enter a new password!");
      return;
    }

    $.ajax({
      url: BASE_URL + "/reset-password",
      type: "POST",
      data: { email: email, otp: otp, newPassword: newPassword },
      success: function (res) {
        alert(res.message);
        window.location.href = "signInPage.html";
      },
      error: function (xhr) {
        alert("Error: " + xhr.responseJSON.message);
      }
    });
  });
</script>
</body>
</html>
