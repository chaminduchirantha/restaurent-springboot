<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .payment-container {
      max-width: 550px;
      margin-top: 50px;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .btn-primary {
      background-color: #0d6efd;
      border-color: #0d6efd;
      border-radius: 8px;
    }
    .btn-primary:hover {
      background-color: #0b5ed7;
      border-color: #0a58ca;
    }
    .card-logos img {
      height: 30px;
      margin: 0 5px;
    }
  </style>
</head>
<body>

<div class="container payment-container">
  <div class="card p-4">
    <div class="d-flex justify-content-center mb-4 card-logos">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png" alt="Visa Logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/2560px-Mastercard-logo.svg.png" alt="Mastercard Logo">
<!--      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/American_Express_logo_(2018).svg/2560px-American_Express_logo_(2018).svg.png" alt="American Express Logo">-->
<!--      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Discover_card_logo.svg/2560px-Discover_card_logo.svg.png" alt="Discover Logo">-->
<!--      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/JCB_logo.svg/2560px-JCB_logo.svg.png" alt="JCB Logo">-->
    </div>
    <form id="paymentForm">
      <!-- Order Details -->
      <div class="mb-3">
        <label for="orderAmount" class="form-label">Order Amount</label>
        <input type="text" class="form-control" id="orderAmount" readonly>
      </div>

      <hr class="my-4">

      <!-- Payment Details -->
      <h5 class="mb-3">Enter Payment Details</h5>
      <div class="mb-3">
        <label for="cardNumber" class="form-label">Card Number</label>
        <input type="text" class="form-control" id="cardNumber" placeholder="Enter card number" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Enter Email</label>
        <input type="text" class="form-control" id="email" placeholder="Enter email address" required>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="expiryDate" class="form-label">Expiry Date</label>
          <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY" required>
        </div>
        <div class="col-md-6 mb-3">
          <label for="cvv" class="form-label">CVV</label>
          <input type="text" class="form-control" id="cvv" placeholder="CVV" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="cardName" class="form-label">Cardholder Name</label>
        <input type="text" class="form-control" id="cardName" placeholder="Name on card" required>
      </div>

      <button type="button" class="btn btn-primary w-100 mt-4" id="payButton">Pay Now</button>
    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  $(document).ready(function() {
    // Load total from sessionStorage
    const total = sessionStorage.getItem("lastOrderTotal") || 0;
    $("#orderAmount").val("Rs. " + parseFloat(total).toFixed(2));

    // Handle form submit
    $("#payButton").on("click", function(e) {
      e.preventDefault();

      const token = localStorage.getItem("token");

      const paymentData = {
        orderAmount: total,
        cardHolderName: $("#cardName").val().trim(),
        email: $("#email").val().trim(),
        cardNumber: parseInt($("#cardNumber").val().trim()),
        expireDate: $("#expiryDate").val().trim(),
        cvv: parseInt($("#cvv").val().trim())
      };
      if(!paymentData.cardHolderName || !paymentData.email || !paymentData.cardNumber ||
              !paymentData.expireDate || !paymentData.cvv){
        Swal.fire({
          icon: 'warning',
          title: 'Missing Fields',
          text: 'Please fill all payment fields before proceeding.'
        });
        return;
      }


      // Confirmation dialog before sending
      Swal.fire({
        title: 'Confirm Payment',
        text: "Do you want to proceed with the payment?",
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Yes, Pay Now!',
        cancelButtonText: 'Cancel'
      }).then((result) => {
        if (result.isConfirmed) {
          $.ajax({
            url: "http://localhost:8080/api/v1/payment/save",
            method: "POST",
            contentType: "application/json",
            headers: {
              "Authorization": "Bearer " + token
            },
            data: JSON.stringify(paymentData),
            success: function(res) {
              Swal.fire({
                icon: 'success',
                title: 'Payment Successful!',
                text: 'Your payment has been processed. Payment ID: ' + res.data.paymentId,
                confirmButtonText: 'OK'
              }).then(() => {
                sessionStorage.removeItem("lastOrderTotal");
                window.location.href = "order-success.html"; // Optional redirect
              });
            },
            error: function(xhr) {
              Swal.fire({
                icon: 'error',
                title: 'Payment Failed!',
                text: 'Please try again.',
              });
            }
          });
        }
      });
    });
  });
</script>


</body>
</html>
