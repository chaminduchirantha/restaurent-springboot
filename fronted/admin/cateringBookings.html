<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>functionsHallBooking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h2 class="mb-4">Booking Reservations</h2>

    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>Full Name</th>
            <th>Phone Number</th>
            <th>Email-</th>
            <th>date</th>
            <th>time</th>
            <th>type</th>
            <th>no of guest</th>
        </tr>
        </thead>
        <tbody id="cateringBookingTableBody">
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const token = localStorage.getItem('token');
    $(document).ready(function () {
        loadCateringBookings();
    });

    function authHeaders() {
        return {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        };
    }
    function loadCateringBookings() {
        $.ajax({
            url: `http://localhost:8080/api/v1/catering/all`,
            type: 'GET',
            headers: authHeaders(),
            success: function (res) {
                const cateringBooking = res.data || []; // <-- important
                let rows = "";
                cateringBooking.forEach(cateringBooking => {
                    rows +=
                        `<tr>
                     <td>${cateringBooking.fullname}</td>
                     <td>${cateringBooking.phoneNumber}</td>
                     <td>${cateringBooking.email}</td>
                     <td>${cateringBooking.date}</td>
                     <td>${cateringBooking.time}</td>
                     <td>${cateringBooking.type}</td>
                     <td>${cateringBooking.guests}</td>
                     <td>
                         <button class="btn btn-sm btn-danger">Cancel Booking</button>
                     </td>
                  </tr>`;
                });
                $('#cateringBookingTableBody').html(rows);
            },
            error: function (err) {
                console.log(err);
                alert("Failed to load customers");
            }
        });
    }
</script>
</body>
</html>
