<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/lib/fontawasome/fontawesome-free-6.7.2-web/css/all.css">

</head>
<body>

<section class="container py-2">
    <div>
        <a href="adminDashBoard.html" style="text-decoration: none"><i class="fa-solid fa-arrow-left" style="font-size: 20px; color: black"></i></a>
    </div>
    <h1 class="text-center mb-4">Manage Feedback</h1>
    <!-- Add Menu Item Button -->
    <div class="text-end mb-3">
        <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
            + Add Feedback
        </button>
    </div>

    <!-- Menu Items Table -->
    <div class="table-responsive shadow-sm rounded-4 bg-white">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <!--        <th>#</th>-->
                <th>Email</th>
                <th>full name</th>
                <th>massage</th>
                <th>ratings</th>
                <th>services</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody id="feedbackTableBody">
            <!-- JS will populate rows -->
            </tbody>
        </table>
    </div>
</section>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

    const token = localStorage.getItem('token');
    $(document).ready(function () {
        loadCustomers();
    });

    function authHeaders() {
        return {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        };
    }
    function loadCustomers() {
        $.ajax({
            url: `http://localhost:8080/api/v1/feedback/all`,
            type: 'GET',
            headers: authHeaders(),
            success: function (res) {
                const feedback = res.data || []; // <-- important
                let rows = "";
                feedback.forEach(feedback => {
                    rows +=
                        `<tr>
                     <td>${feedback.fullname}</td>
                     <td>${feedback.email}</td>
                     <td>${feedback.services}</td>
                     <td>${feedback.ratings}</td>
                     <td>${feedback.message}</td>
                     <td>
                         <button class="btn btn-warning me-2">Edit</button>
                         <button class="btn btn-sm btn-danger">Delete</button>
                     </td>
                  </tr>`;
                });
                $('#feedbackTableBody').html(rows);
                loadPagination(); // make sure pagination is called here
            },
            error: function(err){
                console.log(err);
                alert("Failed to load Feedback");
            }
        });
    }
</script>
</body>
</html>
