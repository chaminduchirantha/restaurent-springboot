<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<section class="container py-2">
    <div>
        <a href="adminDashBoard.html" style="text-decoration: none"><i class="fa-solid fa-arrow-left" style="font-size: 20px; color: black"></i></a>
    </div>
    <h1 class="text-center mb-4">Manage Orders</h1>
    <!-- Add Menu Item Button -->
    <div class="text-end mb-3">
        <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
            + Add Mail
        </button>
    </div>

    <!-- Menu Items Table -->
    <div class="table-responsive shadow-sm rounded-4 bg-white">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <!--        <th>#</th>-->
                <th>name</th>
                <th>price</th>
                <th>order type</th>
                <th>qty</th>
                <th>orders date</th>
                <th>email</th>
                <th>status</th>
                <th>notes</th>
<!--                <th class="text-center">Actions</th>-->
            </tr>
            </thead>
            <tbody id="orderTableBody">
            <!-- JS will populate rows -->
            </tbody>
        </table>
    </div>
</section>


<div class="modal fade" id="addCustomerModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4 shadow-lg border-0">

            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="menuModalLabel">Add Customer</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <div class="container">
                    <form class="mx-auto p-4 p-md-5 shadow rounded-4 border border-light bg-white" style="max-width: 700px;">
                        <div class="row g-3">
                            <div class="mb-3">
                                <input type="text" class="form-control custom-form" id="to" placeholder="To" required>
                            </div>
                            <div class= "mb-3">
                                <input type="text" class="form-control custom-form" id="subject" placeholder="subject" required>
                            </div>
                            <div class="col-12 mb-3">
                                <textarea class="form-control custom-form" id="message" rows="10" placeholder="Type to hear Message"></textarea>
                            </div>
                        </div>
                        <div class="container mt-5">
                            <div class="toolbar">
                                <div class="btn-group">
                                    <button class="btn send-btn"  type="button" id="send">Send</button>
                                </div>

                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<nav aria-label="..." style="position: relative; top:50px;" >
    <div class="d-flex justify-content-center align-items-center mb-3">
        <ul class="pagination pagination-md"  style="gap: 10px;">
            <li class="page-item active" aria-current="page">
                <span class="page-link">1</span>
            </li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">4</a></li>
            <li class="page-item"><a class="page-link" href="#">5</a></li>
            <li class="page-item"><a class="page-link" href="#">6</a></li>
            <li class="page-item"><a class="page-link" href="#">7</a></li>
            <li class="page-item"><a class="page-link" href="#">8</a></li>
            <li class="page-item"><a class="page-link" href="#">9</a></li>
            <li class="page-item"><a class="page-link" href="#">10</a></li>
        </ul>
    </div>
</nav>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = localStorage.getItem("token");

    function authHeaders() {
        return {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        };
    }

    $(document).ready(function () {
        loadOrders();
    });
    function loadOrders() {
        $.ajax({
            url: `http://localhost:8080/api/v1/orders/all`,
            type: 'GET',
            headers: authHeaders(),
            success: function (res) {
                const orders = res.data || []; // <-- important
                let rows = "";
                orders.forEach(order => {
                    rows +=
                        `<tr>
                     <td>${order.name}</td>
                     <td>${order.price}</td>
                     <td>${order.orderType}</td>
                     <td>${order.orderQty}</td>
                     <td>${order.orderDatetime}</td>
                     <td>${order.email}</td>
                     <td>${order.status}</td>
                     <td>${order.notes}</td>
                  </tr>`;
                });
                $('#orderTableBody').html(rows);
                // loadPagination(); // make sure pagination is called here
            },
            error: function(err){
                console.log(err);
                alert("Failed to load Orders");
            }
        });
    }

    $("#send").on("click", function (e) {
        e.preventDefault();

        const mailData = {
            toMail: $("#to").val(),
            subject: $("#subject").val(),
            massage: $("#message").val()   // ✅ DTO field ekata match wenna
        };

        $.ajax({
            url: "http://localhost:8080/api/v1/mail/send",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(mailData),
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("token") // auth token hadanneth
            },
            success: function (response) {
                alert(response); // Email sent successfully
            },
            error: function (xhr) {
                alert("Error sending mail: " + xhr.responseText);
            }
        });
    });
</script>

</body>
</html>
