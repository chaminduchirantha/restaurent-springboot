<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<section class="container py-2">
    <div>
        <a href="adminDashBoard.html" style="text-decoration: none">
            <i class="fa-solid fa-arrow-left" style="font-size: 20px; color: black"></i>
        </a>
    </div>
    <h1 class="text-center mb-4">Manage Orders</h1>

    <!-- Orders Table -->
    <div class="table-responsive shadow-sm bg-white mb-4">
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Order Type</th>
                <th>Qty</th>
                <th>Orders Date</th>
                <th>Email</th>
                <th>Status</th>
                <th>Notes</th>
            </tr>
            </thead>
            <tbody id="orderTableBody">
            <!-- JS will populate rows -->
            </tbody>
        </table>
        <nav aria-label="..." style="position: relative; top:10px;" >
            <div class="d-flex justify-content-center align-items-center mb-3">
                <ul class="pagination pagination-md"  style="gap: 10px;">
                    <li class="page-item active" aria-current="page">
                        <span class="page-link">1</span>
                    </li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#">4</a></li>
                    <li class="page-item"><a class="page-link" href="#">5</a></li>
                    <li class="page-item"><a class="page-link" href="#">6</a></li>
                    <li class="page-item"><a class="page-link" href="#">7</a></li>
                    <li class="page-item"><a class="page-link" href="#">8</a></li>
                    <li class="page-item"><a class="page-link" href="#">9</a></li>
                    <li class="page-item"><a class="page-link" href="#">10</a></li>
                </ul>
            </div>
        </nav>
    </div>


    <!-- Mail Sending Section -->
    <div class="d-flex justify-content-center mt-4">
        <div class="card shadow-sm border-0 col-lg-8">
            <div class="card-header text-black fw-bold">
                Send Mail
            </div>
            <div class="card-body">
                <form id="mailForm">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="to" placeholder="To" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" id="subject" placeholder="Subject" required>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" id="message" rows="6" placeholder="Type your message..."></textarea>
                    </div>
                    <button class="btn btn-primary w-100" type="button" id="send">Send</button>
                </form>
            </div>
        </div>
    </div>

</section>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

    let currentPage = 0;
    const pageSize = 5;
    const token = localStorage.getItem("token");

    function authHeaders() {
        return {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        };
    }

    $(document).ready(function () {
        loadOrders();
    });
    function loadOrders() {
        $.ajax({
            url: `http://localhost:8080/api/v1/orders/paginated?page=${currentPage}&size=${pageSize}`,
            type: 'GET',
            headers: authHeaders(),
            success: function (res) {
                const orders = res.data || []; // <-- important
                let rows = "";
                orders.forEach(order => {
                    rows +=
                        `<tr>
                     <td>${order.name}</td>
                     <td>${order.price}</td>
                     <td>${order.orderType}</td>
                     <td>${order.orderQty}</td>
                     <td>${order.orderDatetime}</td>
                     <td>${order.email}</td>
                     <td>${order.status}</td>
                     <td>${order.notes}</td>
                  </tr>`;
                });
                $('#orderTableBody').html(rows);
                loadPagination(); // make sure pagination is called here
            },
            error: function(err){
                console.log(err);
                alert("Failed to load Orders");
            }
        });
    }

    function loadPagination() {
        $.ajax({
            url: `http://localhost:8080/api/v1/orders/total-pages?size=${pageSize}`,
            method: "GET",
            success: function (totalPages) {
                let paginationHTML = "";
                for (let i = 0; i < totalPages; i++) {
                    paginationHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="goToPage(${i})">${i + 1}</a>
                    </li>
                `;
                }
                $('.pagination').html(paginationHTML);
            },
            error: function (xhr) {
                console.error("Error loading pagination:", xhr.responseText);
            }
        });
    }

    function goToPage(page) {
        currentPage = page;
        loadOrders();
    }


    $("#send").on("click", function (e) {
        e.preventDefault();

        const mailData = {
            toMail: $("#to").val(),
            subject: $("#subject").val(),
            massage: $("#message").val()
        };

        $.ajax({
            url: "http://localhost:8080/api/v1/mail/send",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(mailData),
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("token") // auth token hadanneth
            },
            success: function (response) {
                alert(response); // Email sent successfully
            },
            error: function (xhr) {
                alert("Error sending mail: " + xhr.responseText);
            }
        });
    });
</script>

</body>
</html>
