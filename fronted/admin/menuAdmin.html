<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Menu Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Assets/lib/fontawasome/fontawesome-free-6.7.2-web/css/all.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="p-4">

<section class="container py-2">
  <div>
    <a href="adminDashBoard.html" style="text-decoration: none"><i class="fa-solid fa-arrow-left" style="font-size: 20px; color: black"></i></a>
  </div>
  <h1 class="text-center mb-4">Manage Menus</h1>
  <!-- Add Menu Item Button -->
  <div class="text-end mb-3">
    <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#menuModal">
      + Add New Menu Item
    </button>
  </div>

  <!-- Menu Items Table -->
  <div class="container " style="margin-top: 20px">
    <div class="row" id="itemContainer">

    </div>
  </div>
</section>

<!-- Modal Form -->
<div class="modal fade" id="menuModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 shadow-lg border-0">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="menuModalLabel">Add Menu Item</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form id="menuForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Menu Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter item name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="description" class="form-control" rows="3" placeholder="Enter item description" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-control" id="category" required>
              <option >select Category</option>
              <option value="Rice">Rice</option>
              <option value="kottu">Kottu</option>
              <option value="indianfoods">Indian Foods</option>
              <option value="bakery">Bakery</option>
              <option value="beverages">Hot Beverages</option>
            </select>

          </div>

          <div class="mb-3">
            <label class="form-label">Price (Rs.)</label>
            <input type="number" step="0.01" id="price" class="form-control" placeholder="Enter price" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Upload Images</label>
            <input type="file" id="image" class="form-control" accept="image/*" multiple required>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <!-- on click only -->
        <button type="button" id="saveItemBtn" class="btn btn-primary">Save Item</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  const token = localStorage.getItem('token');

  $(document).ready(function(){
    loadItems();
  });

  function authHeaders() {
    return {
      'Authorization': 'Bearer ' + token,
    };
  }
  $('#saveItemBtn').on('click', function () {

    let item = {
      name: $('#name').val(),
      description: $('#description').val(),
      price: $('#price').val(),
      category: $('#category').val()
    };

    let formData = new FormData();
    formData.append('item', new Blob([JSON.stringify(item)], {type: 'application/json'}));

    let files = $('#image')[0].files;
    for(let i = 0; i < files.length; i++){
      formData.append('file', files[i]);
    }

    $.ajax({
      url: 'http://localhost:8080/api/v1/menu/addItem',
      method: 'POST',
      headers: authHeaders(),
      data: formData,
      processData: false,
      contentType: false,
      success: function (response) {
        if(response.status === 201) {
          Swal.fire({
            icon: "success",
            title: "Added Successfully",
            showConfirmButton: false,
            timer: 2000
          }).then(() => {
            $('#menuModal').modal('hide');
            loadItems();
          })
        } else {
          Swal.fire({
            icon: "error",
            title: response.message || "Something went wrong",
            showConfirmButton: false,
            timer: 2000
          })
        }
      },
      error: function (xhr) {
        if(xhr.status === 403){
          Swal.fire({
            icon: "error",
            title: "Not Authenticated",
            showConfirmButton: false,
            timer: 2000
          })
        } else {
          Swal.fire({
            icon: "error",
            title: "Server Error",
            showConfirmButton: false,
            timer: 2000
          })
        }
      }
    });
  });

  function loadItems() {
    $.ajax({
      url: "http://localhost:8080/api/v1/menu/getAllMenus",
      method: "GET",
      headers: {
        "Authorization": "Bearer " + localStorage.getItem("token")
      },
      success: function (response) {
        console.log("Items =>", response);

        let items = response.data;
        let container = $("#itemContainer");
        container.empty();

        items.forEach(item => {
          let card = `
          <div class="col-lg-4 col-md-6 col-sm-12 mb-4">
            <div class="card h-100 shadow-lg border-0 rounded-4 overflow-hidden">
                <img src="${item.images && item.images.length ? 'http://localhost:8080/uploads/' + item.images[0] : 'Assets/images/img_5.png'}" class="card-img-top" alt="${item.name}">
                <div class="card-body text-left">
                    <div class="d-flex justify-content-between mb-2">
                        <h5 class="card-title fw-bold">${item.name}</h5>
                        <h5 class="text-danger fw-bold">Rs : ${item.price}.00</h5>
                    </div>
                    <span class="badge bg-warning text-dark mb-2">${item.category}</span>
                    <p class="card-text">${item.description}</p>

                    <div class="d-flex justify-content-between mt-3">
                      <button class="btn btn-outline-primary btn-sm edit-btn" data-id="${item.id}">
                        <i class="fas fa-edit"></i> Edit
                      </button>
                      <button class="btn btn-outline-danger btn-sm delete-btn" data-id="${item.id}">
                        <i class="fas fa-trash"></i> Delete
                      </button>
                    </div>
                </div>
            </div>
        </div>
        `;
          container.append(card);
        });
      },
      error: function (xhr) {
        alert("Failed to load items: " + xhr.responseText);
      }
    });
  }
