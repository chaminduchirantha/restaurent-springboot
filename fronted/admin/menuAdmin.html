<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Menu Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .card-img-top {
      height: 200px;
      object-fit: cover;
    }
    .action-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .card {
      position: relative;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .badge {
      font-size: 0.8rem;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #6c757d;
    }
    .empty-state i {
      font-size: 5rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="p-4 bg-light">




<section class="container py-2">

  <h5 class="text-left mb-4 mt-3">Manage Menu Items</h5>

  <div class="row align-items-center g-2 mb-6">
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input id="menuSearch" type="text" class="form-control" placeholder="Search by name">
        <button id="clearSearch" class="btn btn-outline-secondary" type="button" title="Clear">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
    <div class="col-md-6 text-md-end">
      <span id="resultCount" class="badge bg-secondary d-none">0 results</span>
    </div>
  </div>

  <!-- Add Menu Item Button -->
  <div class="text-end mb-4">
    <button type="button" class="btn btn-warning btn-md" data-bs-toggle="modal" data-bs-target="#menuModal">
      <i class="fas fa-plus-circle me-2"></i>Add New Menu Item
    </button>
  </div>

  <!-- Menu Items Table -->
  <div class="container-fluid" style="margin-top: 20px">
    <div class="row" id="itemContainer">
      <div class="col-12 empty-state" id="emptyState">
        <i class="fas fa-utensils"></i>
        <h3>No Menu Items Yet</h3>
        <p>Get started by adding your first menu item!</p>
      </div>
    </div>
  </div>
</section>

<!-- Search Bar -->


<!-- Modal Form -->
<div class="modal fade" id="menuModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 shadow-lg border-0">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="menuModalLabel">Add Menu Item</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form id="menuForm" enctype="multipart/form-data">
          <input type="hidden" id="menuId" value="">
          <div class="mb-3">
            <label class="form-label">Menu Name <span class="text-danger">*</span></label>
            <input type="text" id="name" class="form-control" placeholder="Enter item name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description <span class="text-danger">*</span></label>
            <textarea id="description" class="form-control" rows="3" placeholder="Enter item description" required></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Category <span class="text-danger">*</span></label>
              <select class="form-control" id="category" required>
                <option value="">Select Category</option>
                <option value="Rice">Rice</option>
                <option value="kottu">Kottu</option>
                <option value="indianfoods">Indian Foods</option>
                <option value="bakery">Bakery</option>
                <option value="beverages">Hot Beverages</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Price (Rs.) <span class="text-danger">*</span></label>
              <input type="number" step="0.01" min="0" id="price" class="form-control" placeholder="Enter price" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Upload Image <span class="text-danger">*</span></label>
            <input type="file" id="image" class="form-control" accept="image/*" required>
            <div class="form-text">Only JPG, PNG or WEBP images. Max size 2MB.</div>
            <div class="mt-2" id="imagePreview"></div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="saveItemBtn" class="btn btn-primary">
          <span id="saveButtonText">Save Item</span>
          <div id="saveSpinner" class="spinner-border spinner-border-sm d-none" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>

<nav aria-label="..." style="position: relative; top:20px;" >
  <div class="d-flex justify-content-center align-items-center mb-1" style="margin-left: 20px">
    <ul class="pagination pagination-md" style="gap: 10px;" >
      <li class="page-item active" aria-current="page">
        <span class="page-link">1</span>
      </li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">3</a></li>
      <li class="page-item"><a class="page-link" href="#">4</a></li>
      <li class="page-item"><a class="page-link" href="#">5</a></li>
      <li class="page-item"><a class="page-link" href="#">6</a></li>
      <li class="page-item"><a class="page-link" href="#">7</a></li>
      <li class="page-item"><a class="page-link" href="#">8</a></li>
      <li class="page-item"><a class="page-link" href="#">9</a></li>
      <li class="page-item"><a class="page-link" href="#">10</a></li>
    </ul>
  </div>
</nav>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  let currentPage = 0;
  const pageSize = 3;

  const token = localStorage.getItem('token');
  let currentMenuId = null;
  const menuModal = new bootstrap.Modal(document.getElementById('menuModal'));

  $(document).ready(function () {
    // Check if user is authenticated
    if (!token) {
      Swal.fire({
        icon: 'warning',
        title: 'Authentication Required',
        text: 'Please login to access this page',
        confirmButtonText: 'Go to Login'
      }).then(() => {
        window.location.href = 'login.html';
      });
      return;
    }

    loadMenus();

    // Save item button click handler
    $('#saveItemBtn').click(function() {
      saveMenuItem();
    });

    // Reset form when modal is closed
    $('#menuModal').on('hidden.bs.modal', function () {
      resetForm();
    });

    // Image preview functionality
    $('#image').change(function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          $('#imagePreview').html(`
            <img src="${e.target.result}" class="img-thumbnail mt-2" style="max-height: 200px;">
          `);
        }
        reader.readAsDataURL(file);
      }
    });
  });

  function authHeaders() {
    return {
      'Authorization': 'Bearer ' + token
    };
  }

  function escapeString(str) {
    if (!str) return '';
    return String(str)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
  }

  function loadMenus() {
    $.ajax({
      url: `http://localhost:8080/api/v1/menu/paginated?page=${currentPage}&size=${pageSize}`,
      type: "GET",
      headers: authHeaders(),
      success: function (res) {
        if (res.status === 200 && res.data && res.data.length > 0) {
          $("#emptyState").hide();
          $("#itemContainer").empty();
          res.data.forEach(menu => {
            const imageUrl = `http://localhost:8080/api/v1/menu/images/${escapeString(menu.imageUrl)}`;

            let card = `
                <div class="col-md-3 mb-4">
                  <div class="card shadow-sm rounded-4 h-100">
                    <img src="${imageUrl}"
                         class="card-img-top"
                         alt="${escapeString(menu.name)}"
                         onerror="this.onerror=null; this.src='https://via.placeholder.com/286x180?text=Image+not+found';">
                    <div class="action-buttons">
                        <button class="btn btn-sm btn-primary me-1 edit-btn"
                                data-id="${menu.menuid}"
                                data-name="${escapeString(menu.name)}"
                                data-desc="${escapeString(menu.description)}"
                                data-cat="${escapeString(menu.category)}"
                                data-price="${menu.price}"
                                data-img="${escapeString(menu.imageUrl)}">
                          <i class="fas fa-edit"></i>
                        </button>
                      </button>
                      <button class="btn btn-sm btn-danger" onclick="deleteMenuItem(${menu.menuid})">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                    <div class="card-body">
                      <h5 class="card-title">${escapeString(menu.name)}</h5>
                      <p class="card-text text-muted">${escapeString(menu.description)}</p>
                      <p class="fw-bold">Rs. ${menu.price.toFixed(2)}</p>
                      <span class="badge bg-info">${escapeString(menu.category)}</span>
                    </div>
                  </div>
                </div>
              `;
            $("#itemContainer").append(card);
          });
          loadPagination()
        } else {
          $("#emptyState").show();
        }
      },
      error: function (xhr, status, error) {
        console.error("Error loading menus", error);
        if (xhr.status === 403 || xhr.status === 401) {
          Swal.fire({
            icon: 'error',
            title: 'Authentication Error',
            text: 'Your session has expired. Please login again.',
            confirmButtonText: 'Go to Login'
          }).then(() => {
            window.location.href = 'login.html';
          });
        } else {
          Swal.fire("Error", "Failed to load menus!", "error");
        }
      }
    });
  }

  function loadPagination() {
    $.ajax({
      url: `http://localhost:8080/api/v1/menu/total-pages?size=${pageSize}`,
      method: "GET",
      success: function (totalPages) {
        let paginationHTML = "";
        for (let i = 0; i < totalPages; i++) {
          paginationHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="goToPage(${i})">${i + 1}</a>
                    </li>
                `;
        }
        $('.pagination').html(paginationHTML);
      },
      error: function (xhr) {
        console.error("Error loading pagination:", xhr.responseText);
      }
    });
  }

  function goToPage(page) {
    currentPage = page;
    loadMenus();
  }

  $(document).on('click', '.edit-btn', function() {
    const btn = $(this);
    editMenuItem(
            btn.data('id'),
            btn.data('name'),
            btn.data('desc'),
            btn.data('cat'),
            btn.data('price'),
            btn.data('img')
    );
  });


  function saveMenuItem() {
    // Validate form
    if (!$('#name').val() || !$('#description').val() || !$('#category').val() || !$('#price').val()) {
      Swal.fire("Error", "Please fill all required fields!", "error");
      return;
    }

    // Validate image for new items
    if (!currentMenuId && !$('#image')[0].files[0]) {
      Swal.fire("Error", "Please select an image!", "error");
      return;
    }

    const formData = new FormData();
    formData.append('name', $('#name').val());
    formData.append('description', $('#description').val());
    formData.append('category', $('#category').val());
    formData.append('price', $('#price').val());

    // Only append file if selected
    if ($('#image')[0].files[0]) {
      formData.append('file', $('#image')[0].files[0]);
    }

    // If editing, include the ID
    if (currentMenuId) {
      formData.append('id', currentMenuId);
    }

    const url = currentMenuId
            ? "http://localhost:8080/api/v1/menu/updateItem"
            : "http://localhost:8080/api/v1/menu/addItem";

    // Show loading state
    $('#saveSpinner').removeClass('d-none');
    $('#saveButtonText').text(currentMenuId ? 'Updating...' : 'Saving...');
    $('#saveItemBtn').prop('disabled', true);

    $.ajax({
      url: url,
      type: currentMenuId ? "PUT" : "POST",
      headers: {
        'Authorization': 'Bearer ' + token
      },
      data: formData,
      processData: false,
      contentType: false,
      success: function (response) {
        Swal.fire("Success", "Menu item saved successfully!", "success");
        menuModal.hide();
        resetForm();
        loadMenus();
      },
      error: function (xhr, status, error) {
        console.error("Error saving menu", error);
        if (xhr.status === 500) {
          Swal.fire("Error", "Server error. Please check if the image format is supported and try again.", "error");
        } else {
          Swal.fire("Error", "Failed to save menu item!", "error");
        }
      },
      complete: function() {
        // Reset button state
        $('#saveSpinner').addClass('d-none');
        $('#saveButtonText').text(currentMenuId ? 'Update Item' : 'Save Item');
        $('#saveItemBtn').prop('disabled', false);
      }
    });
  }

  function editMenuItem(id, name, description, category, price, imageUrl) {
    currentMenuId = id;
    $('#menuId').val(id);
    $('#name').val(name);
    $('#description').val(description);
    $('#category').val(category);
    $('#price').val(price);

    const fullImageUrl = `http://localhost:8080/api/v1/menu/images/${escapeString(imageUrl)}`;

    // Show current image
    $('#imagePreview').html(`
      <div class="alert alert-info mt-2">
        <i class="fas fa-info-circle me-2"></i>Current image: ${escapeString(imageUrl)}
      </div>
      <img src="${fullImageUrl}"
           class="img-thumbnail mt-2" style="max-height: 200px;"
           onerror="this.style.display='none'">
    `);

    // Make image optional for editing
    $('#image').removeAttr('required');

    // Change modal title for editing
    $('#menuModalLabel').text('Edit Menu Item');
    $('#saveButtonText').text('Update Item');

    menuModal.show();
  }

  function deleteMenuItem(id) {
    Swal.fire({
      title: 'Are you sure?',
      text: "This menu item will be permanently deleted!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
      if (result.isConfirmed) {
        $.ajax({
          url: `http://localhost:8080/api/v1/menu/delete/${id}`,
          type: "DELETE",
          headers: authHeaders(),
          success: function (response) {
            Swal.fire("Deleted!", "Menu item has been deleted.", "success");
            loadMenus();
          },
          error: function (xhr, status, error) {
            console.error("Error deleting menu", error);
            if (xhr.status === 403 || xhr.status === 401) {
              Swal.fire("Error", "You don't have permission to delete menu items.", "error");
            } else if (xhr.status === 500) {
              Swal.fire("Error", "Server error. Please try again later.", "error");
            } else {
              Swal.fire("Error", "Failed to delete menu item!", "error");
            }
          }
        });
      }
    });
  }

  // Search functionality
  $('#menuSearch').on('keyup', function () {
    let keyword = $(this).val().trim();

    if (keyword.length === 0) {
      // If empty, load paginated menus
      currentPage = 0;
      loadMenus();
      $('#clearSearch').hide();
      $('#resultCount').addClass('d-none');
      return;
    }

    $.ajax({
      url: `http://localhost:8080/api/v1/menu/search/${encodeURIComponent(keyword)}`,
      type: "GET",
      headers: authHeaders(),
      success: function (res) {
        if (res.status === 200 && res.data && res.data.length > 0) {
          $("#emptyState").hide();
          $("#itemContainer").empty();

          res.data.forEach(menu => {
            const imageUrl = `http://localhost:8080/api/v1/menu/images/${escapeString(menu.imageUrl)}`;

            let card = `
            <div class="col-md-4 mb-4">
              <div class="card shadow-sm rounded-4 h-100">
                <img src="${imageUrl}"
                     class="card-img-top"
                     alt="${escapeString(menu.name)}"
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/286x180?text=Image+not+found';">
                <div class="action-buttons">
                    <button class="btn btn-sm btn-primary me-1 edit-btn"
                            data-id="${menu.menuid}"
                            data-name="${escapeString(menu.name)}"
                            data-desc="${escapeString(menu.description)}"
                            data-cat="${escapeString(menu.category)}"
                            data-price="${menu.price}"
                            data-img="${escapeString(menu.imageUrl)}">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteMenuItem(${menu.menuid})">
                      <i class="fas fa-trash"></i>
                    </button>
                </div>
                <div class="card-body">
                  <h5 class="card-title">${escapeString(menu.name)}</h5>
                  <p class="card-text text-muted">${escapeString(menu.description)}</p>
                  <p class="fw-bold">Rs. ${menu.price.toFixed(2)}</p>
                  <span class="badge bg-info">${escapeString(menu.category)}</span>
                </div>
              </div>
            </div>
          `;
            $("#itemContainer").append(card);
          });

          // Show result count
          $('#resultCount').removeClass('d-none').text(`${res.data.length} results found`);
          $('#clearSearch').show();
        } else {
          $("#itemContainer").empty();
          $("#emptyState").show();
          $('#resultCount').removeClass('d-none').text("0 results");
        }
      },
      error: function () {
        Swal.fire("Error", "Search failed!", "error");
      }
    });
  });

  // Clear search
  $('#clearSearch').click(function () {
    $('#menuSearch').val('');
    $('#clearSearch').hide();
    $('#resultCount').addClass('d-none');
    currentPage = 0;
    loadMenus();
  });


  function resetForm() {
    currentMenuId = null;
    $('#menuId').val('');
    $('#menuForm')[0].reset();
    $('#image').attr('required', 'required');
    $('#imagePreview').empty();
    $('#menuModalLabel').text('Add Menu Item');
    $('#saveButtonText').text('Save Item');
  }
</script>
</body>
</html>
