<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Menu Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .card-img-top {
      height: 200px;
      object-fit: cover;
    }
    .action-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .card {
      position: relative;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .badge {
      font-size: 0.8rem;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #6c757d;
    }
    .empty-state i {
      font-size: 5rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="p-4 bg-light">

<section class="container py-2">
  <div>
    <a href="adminDashBoard.html" style="text-decoration: none">
      <i class="fa-solid fa-arrow-left me-2" style="font-size: 20px; color: black"></i> Back to Dashboard
    </a>
  </div>
  <h1 class="text-center mb-4 mt-3">Manage Menu Items</h1>

  <!-- Add Menu Item Button -->
  <div class="text-end mb-4">
    <button type="button" class="btn btn-warning btn-lg" data-bs-toggle="modal" data-bs-target="#menuModal">
      <i class="fas fa-plus-circle me-2"></i>Add New Menu Item
    </button>
  </div>

  <!-- Menu Items Table -->
  <div class="container-fluid" style="margin-top: 20px">
    <div class="row" id="itemContainer">
      <div class="col-12 empty-state" id="emptyState">
        <i class="fas fa-utensils"></i>
        <h3>No Menu Items Yet</h3>
        <p>Get started by adding your first menu item!</p>
      </div>
    </div>
  </div>
</section>

<!-- Modal Form -->
<div class="modal fade" id="menuModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 shadow-lg border-0">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="menuModalLabel">Add Menu Item</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form id="menuForm" enctype="multipart/form-data">
          <input type="hidden" id="menuId" value="">
          <div class="mb-3">
            <label class="form-label">Menu Name <span class="text-danger">*</span></label>
            <input type="text" id="name" class="form-control" placeholder="Enter item name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description <span class="text-danger">*</span></label>
            <textarea id="description" class="form-control" rows="3" placeholder="Enter item description" required></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Category <span class="text-danger">*</span></label>
              <select class="form-control" id="category" required>
                <option value="">Select Category</option>
                <option value="Rice">Rice</option>
                <option value="kottu">Kottu</option>
                <option value="indianfoods">Indian Foods</option>
                <option value="bakery">Bakery</option>
                <option value="beverages">Hot Beverages</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Price (Rs.) <span class="text-danger">*</span></label>
              <input type="number" step="0.01" min="0" id="price" class="form-control" placeholder="Enter price" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Upload Image <span class="text-danger">*</span></label>
            <input type="file" id="image" class="form-control" accept="image/*" required>
            <div class="form-text">Only JPG, PNG or WEBP images. Max size 2MB.</div>
            <div class="mt-2" id="imagePreview"></div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="saveItemBtn" class="btn btn-primary">
          <span id="saveButtonText">Save Item</span>
          <div id="saveSpinner" class="spinner-border spinner-border-sm d-none" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  const token = localStorage.getItem('token');
  let currentMenuId = null;
  const menuModal = new bootstrap.Modal(document.getElementById('menuModal'));

  $(document).ready(function () {
    // Check if user is authenticated
    if (!token) {
      Swal.fire({
        icon: 'warning',
        title: 'Authentication Required',
        text: 'Please login to access this page',
        confirmButtonText: 'Go to Login'
      }).then(() => {
        window.location.href = 'login.html';
      });
      return;
    }

    loadMenus();

    // Save item button click handler
    $('#saveItemBtn').click(function() {
      saveMenuItem();
    });

    // Reset form when modal is closed
    $('#menuModal').on('hidden.bs.modal', function () {
      resetForm();
    });

    // Image preview functionality
    $('#image').change(function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          $('#imagePreview').html(`
            <img src="${e.target.result}" class="img-thumbnail mt-2" style="max-height: 200px;">
          `);
        }
        reader.readAsDataURL(file);
      }
    });
  });

  function authHeaders() {
    return {
      'Authorization': 'Bearer ' + token
    };
  }

  function loadMenus() {
    $.ajax({
      url: "http://localhost:8080/api/v1/menu/all",
      type: "GET",
      headers: authHeaders(),
      success: function (res) {
        if (res.status === 200 && res.data && res.data.length > 0) {
          $("#emptyState").hide();
          $("#itemContainer").empty();
          res.data.forEach(menu => {
            let card = `
                <div class="col-md-4 mb-4">
                  <div class="card shadow-sm rounded-4 h-100">
                    <img src="http://localhost:8080/uploads/${menu.imageUrl}"
                         class="card-img-top"
                         alt="${menu.name}"
                         onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22286%22%20height%3D%22180%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20286%20180%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cstyle%20type%3D%22text%2Fcss%22%3E%23holder_17ecc4b4a5d%20text%20%7B%20fill%3A%23999%3Bfont-weight%3Anormal%3Bfont-family%3Avar(--bs-font-sans-serif)%2C%20monospace%3Bfont-size%3A14pt%20%7D%20%3C%2Fstyle%3E%3C%2Fdefs%3E%3Cg%20id%3D%22holder_17ecc4b4a5d%22%3E%3Crect%20width%3D%22286%22%20height%3D%22180%22%20fill%3D%22%23373940%22%3E%3C%2Frect%3E%3Cg%3E%3Ctext%20x%3D%22106.3984375%22%20y%3D%2296.6%22%3EImage%20not%20found%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E'">
                    <div class="action-buttons">
                      <button class="btn btn-sm btn-primary me-1" onclick="editMenuItem(${menu.menuid}, '${escapeString(menu.name)}', '${escapeString(menu.description)}', '${escapeString(menu.category)}', ${menu.price}, '${escapeString(menu.imageUrl)}')">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-danger" onclick="deleteMenuItem(${menu.menuid})">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                    <div class="card-body">
                      <h5 class="card-title">${menu.name}</h5>
                      <p class="card-text text-muted">${menu.description}</p>
                      <p class="fw-bold">Rs. ${menu.price.toFixed(2)}</p>
                      <span class="badge bg-info">${menu.category}</span>
                    </div>
                  </div>
                </div>
              `;
            $("#itemContainer").append(card);
          });
        } else {
          $("#emptyState").show();
        }
      },
      error: function (xhr, status, error) {
        console.error("Error loading menus", error);
        if (xhr.status === 403 || xhr.status === 401) {
          Swal.fire({
            icon: 'error',
            title: 'Authentication Error',
            text: 'Your session has expired. Please login again.',
            confirmButtonText: 'Go to Login'
          }).then(() => {
            window.location.href = 'login.html';
          });
        } else {
          Swal.fire("Error", "Failed to load menus!", "error");
        }
      }
    });
  }

  function escapeString(str) {
    return str ? str.replace(/'/g, "\\'").replace(/"/g, '\\"') : '';
  }

  function saveMenuItem() {
    // Validate form
    if (!$('#name').val() || !$('#description').val() || !$('#category').val() || !$('#price').val()) {
      Swal.fire("Error", "Please fill all required fields!", "error");
      return;
    }

    // Validate image for new items
    if (!currentMenuId && !$('#image')[0].files[0]) {
      Swal.fire("Error", "Please select an image!", "error");
      return;
    }

    const formData = new FormData();
    formData.append('name', $('#name').val());
    formData.append('description', $('#description').val());
    formData.append('category', $('#category').val());
    formData.append('price', $('#price').val());

    // Only append file if selected
    if ($('#image')[0].files[0]) {
      formData.append('file', $('#image')[0].files[0]);
    }

    // If editing, include the ID
    if (currentMenuId) {
      formData.append('id', currentMenuId);
    }

    const url = currentMenuId
            ? "http://localhost:8080/api/v1/menu/updateItem"
            : "http://localhost:8080/api/v1/menu/addItem";

    // Show loading state
    $('#saveSpinner').removeClass('d-none');
    $('#saveButtonText').text(currentMenuId ? 'Updating...' : 'Saving...');
    $('#saveItemBtn').prop('disabled', true);

    $.ajax({
      url: url,
      type: currentMenuId ? "PUT" : "POST",
      headers: {
        'Authorization': 'Bearer ' + token
      },
      data: formData,
      processData: false,
      contentType: false,
      success: function (response) {
        Swal.fire("Success", "Menu item saved successfully!", "success");
        menuModal.hide();
        resetForm();
        loadMenus();
      },
      error: function (xhr, status, error) {
        console.error("Error saving menu", error);
        if (xhr.status === 500) {
          Swal.fire("Error", "Server error. Please check if the image format is supported and try again.", "error");
        } else {
          Swal.fire("Error", "Failed to save menu item!", "error");
        }
      },
      complete: function() {
        // Reset button state
        $('#saveSpinner').addClass('d-none');
        $('#saveButtonText').text(currentMenuId ? 'Update Item' : 'Save Item');
        $('#saveItemBtn').prop('disabled', false);
      }
    });
  }

  function editMenuItem(id, name, description, category, price, imageUrl) {
    currentMenuId = id;
    $('#menuId').val(id);
    $('#name').val(name);
    $('#description').val(description);
    $('#category').val(category);
    $('#price').val(price);

    // Show current image
    $('#imagePreview').html(`
      <div class="alert alert-info mt-2">
        <i class="fas fa-info-circle me-2"></i>Current image: ${imageUrl}
      </div>
      <img src="http://localhost:8080/uploads/${imageUrl}"
           class="img-thumbnail mt-2" style="max-height: 200px;"
           onerror="this.style.display='none'">
    `);

    // Make image optional for editing
    $('#image').removeAttr('required');

    // Change modal title for editing
    $('#menuModalLabel').text('Edit Menu Item');
    $('#saveButtonText').text('Update Item');

    menuModal.show();
  }

  function deleteMenuItem(id) {
    Swal.fire({
      title: 'Are you sure?',
      text: "This menu item will be permanently deleted!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
      if (result.isConfirmed) {
        $.ajax({
          url: `http://localhost:8080/api/v1/menu/delete/${id}`,
          type: "DELETE",
          headers: authHeaders(),
          success: function (response) {
            Swal.fire("Deleted!", "Menu item has been deleted.", "success");
            loadMenus();
          },
          error: function (xhr, status, error) {
            console.error("Error deleting menu", error);
            if (xhr.status === 403 || xhr.status === 401) {
              Swal.fire("Error", "You don't have permission to delete menu items.", "error");
            } else if (xhr.status === 500) {
              Swal.fire("Error", "Server error. Please try again later.", "error");
            } else {
              Swal.fire("Error", "Failed to delete menu item!", "error");
            }
          }
        });
      }
    });
  }

  function resetForm() {
    currentMenuId = null;
    $('#menuId').val('');
    $('#menuForm')[0].reset();
    $('#image').attr('required', 'required');
    $('#imagePreview').empty();
    $('#menuModalLabel').text('Add Menu Item');
    $('#saveButtonText').text('Save Item');
  }
</script>
</body>
</html>
