<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Menu Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Assets/lib/fontawasome/fontawesome-free-6.7.2-web/css/all.css">
</head>
<body class="p-4">

<section class="container py-2">
  <!-- Add Menu Item Button -->
  <div class="text-end mb-3">
    <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
      + Add Customers
    </button>
  </div>

  <!-- Menu Items Table -->
  <div class="table-responsive shadow-sm bg-white">
    <table class="table table-bordered table-hover">
      <thead>
      <tr>
<!--        <th>#</th>-->
        <th>User name</th>
        <th>email</th>
        <th>password</th>
        <th>role</th>
        <th class="text-center">Actions</th>
      </tr>
      </thead>
      <tbody id="customerTableBody">
      <!-- JS will populate rows -->
      </tbody>
    </table>
  </div>
</section>

<!-- Modal Form -->
<div class="modal fade" id="addCustomerModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 shadow-lg border-0">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="menuModalLabel">Add Customer</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <div class="modal-body">
          <form id="addCustomerForm">
            <div class="mb-3">
              <label>Username</label>
              <input type="text" class="form-control" id="addUsername" placeholder="enter user name" required>
            </div>
            <div class="mb-3">
              <label>Password</label>
              <input type="password" class="form-control" id="addPassword" placeholder="enter password" required>
            </div>
            <div class="mb-3">
              <label>Email</label>
              <input type="email" class="form-control" id="addEmail" placeholder="enter email" required>
            </div>
            <div class="mb-3">
              <label>Role</label>
              <select class="form-control" id="addRole" required>
                <option >select role</option>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>
          </form>
      </div>
    </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="saveCustomerBtn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>



<div class="modal fade" id="editCustomerModal" tabindex="-1" aria-labelledby="editCustomerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 shadow-lg border-0">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="editCustomerModalLabel">Edit Customer</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <div class="modal-body">
          <form id="editCustomerForm">
            <div class="mb-3">
              <input type="hidden" id="editUserId">

              <label>Username</label>
              <input type="text" class="form-control" id="editUsername" placeholder="enter user name" required>
            </div>
            <div class="mb-3">
              <label>Password</label>
              <input type="password" class="form-control" id="editPassword" placeholder="enter password" required>
            </div>
            <div class="mb-3">
              <label>Email</label>
              <input type="email" class="form-control" id="editEmail" placeholder="enter email" required>
            </div>
            <div class="mb-3">
              <label>Role</label>
              <select class="form-control" id="editRole" required>
                <option >select role</option>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>
          </form>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="updateCustomerBtn" class="btn btn-primary">Edit</button>
      </div>
    </div>
  </div>
</div>


<nav aria-label="..." style="position: relative; top:50px;" >
  <div class="d-flex justify-content-center align-items-center mb-3">
    <ul class="pagination pagination-md"  style="gap: 10px;">
      <li class="page-item active" aria-current="page">
        <span class="page-link">1</span>

    </ul>
  </div>
</nav>
