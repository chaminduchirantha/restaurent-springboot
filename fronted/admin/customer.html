<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Menu Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<section class="container">

  <!-- Add Menu Item Button -->
  <div class="text-end mb-3">
    <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
      + Add Customers
    </button>
  </div>

  <!-- Menu Items Table -->
  <div class="table-responsive shadow-sm rounded-4">
    <table class="table table-striped table-hover align-middle mb-0">
      <thead class="table-dark">
      <tr>
<!--        <th>#</th>-->
        <th>User name</th>
        <th>email</th>
        <th>password</th>
        <th>role</th>
        <th class="text-center">Actions</th>
      </tr>
      </thead>
      <tbody id="customerTableBody">
      <!-- JS will populate rows -->
      </tbody>
    </table>
  </div>
</section>

<!-- Modal Form -->
<div class="modal fade" id="addCustomerModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 shadow-lg border-0">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="menuModalLabel">Add Customer</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <div class="modal-body">
          <form id="addCustomerForm">
            <div class="mb-3">
              <label>Username</label>
              <input type="text" class="form-control" id="addUsername" placeholder="enter user name" required>
            </div>
            <div class="mb-3">
              <label>Password</label>
              <input type="password" class="form-control" id="addPassword" placeholder="enter password" required>
            </div>
            <div class="mb-3">
              <label>Email</label>
              <input type="email" class="form-control" id="addEmail" placeholder="enter email" required>
            </div>
            <div class="mb-3">
              <label>Role</label>
              <select class="form-control" id="addRole" required>
                <option >select role</option>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>
          </form>
      </div>
    </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="saveCustomerBtn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>


  const token = localStorage.getItem('token');
  $(document).ready(function () {
    loadCustomers();
  });

  function authHeaders() {
    return {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };
  }

  // Load all customers
  function loadCustomers() {
    $.ajax({
      url: `http://localhost:8080/api/v1/user/all`,
      type: 'GET',
      headers: authHeaders(),
      success: function (res) {
        // res.data එකේ තියෙන්නේ array
        const customers = res.data;
        let rows = "";
        customers.forEach(customer => {
          rows += `
                    <tr>
                        <td>${customer.username}</td>
                        <td>${customer.email}</td>
                        <td>${customer.password}</td>
                        <td>${customer.role}</td>
                        <td>
                            <button class="btn btn-warning me-2">Edit</button>
                            <button class="btn btn-sm btn-danger">Delete</button>
                        </td>
                    </tr>
                `;
        });
        $('#customerTableBody').html(rows);
      },
      error: function(err){
        console.log(err);
        alert("Failed to load customers");
      }
    });
  }


  // Save new customer

  $('#saveCustomerBtn').on('click', function (e) {
    e.preventDefault();

    let customerData = {
      username: $('#addUsername').val(),
      email: $('#addEmail').val(),
      password: $('#addPassword').val(),
      role: $('#addRole').val(),
    };

    console.log("Sending customer data:", customerData);

    $.ajax({
      url: "http://localhost:8080/api/v1/user/save",
      type: "POST",
      headers: authHeaders(),
      data: JSON.stringify(customerData),
      success: function (response) {
        alert("customer added Successfully!");
        $('#addCustomerForm')[0].reset();
        $('#addCustomerModal').modal('hide');
        loadCustomers();
      },
      error: function (xhr) {
        console.error("Error saving customer:", xhr.responseText);
        alert("Error: " + xhr.responseText);
      }
    });
  });

</script>
</body>
</html>
