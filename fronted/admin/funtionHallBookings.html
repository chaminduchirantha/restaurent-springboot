<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>functionsHallBooking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h2 class="mb-4">Booking Reservations</h2>

    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>Full Name</th>
            <th>Phone Number</th>
            <th>Email</th>
            <th>Event date</th>
            <th>Event time</th>
            <th>Event Duration</th>
            <th>Services</th>
            <th>Hall No</th>
            <th>special request</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="eventBookingTable">

        </tbody>
    </table>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = localStorage.getItem('token');
    $(document).ready(function () {
        loadTableBookings();
    });

    function authHeaders() {
        return {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        };
    }
    function loadTableBookings() {
        $.ajax({
            url: `http://localhost:8080/api/v1/event/all`,
            type: 'GET',
            headers: authHeaders(),
            success: function (res) {
                const eventBooking = res.data || []; // <-- important
                let rows = "";
                eventBooking.forEach(eb => {
                    rows +=
                        `<tr data-id="${eb.eventId}">
                             <td>${eb.fullname}</td>
                             <td>${eb.phoneNumber}</td>
                             <td>${eb.email}</td>
                             <td>${eb.date}</td>
                             <td>${eb.time}</td>
                             <td>${eb.duration}</td>
                             <td>${eb.services}</td>
                             <td>${eb.hallNo}</td>
                             <td>${eb.requests}</td>
                             <td>
                                 <button class="btn btn-sm btn-danger cancel-btn">Cancel Booking</button>
                             </td>
                        </tr>`;
                });
                $('#eventBookingTable').html(rows);
            },
            error: function(err){
                console.log(err);
                alert("Failed to load bookings");
            }
        });

        $(document).on("click", ".cancel-btn", function () {
            const row = $(this).closest("tr");
            const eventId = row.data("id");

            if (!confirm("Are you sure you want to cancel this booking?")) return;

            $.ajax({
                url: `http://localhost:8080/api/v1/event/delete/${eventId}`,
                type: 'DELETE',
                headers: authHeaders(),
                success: function (res) {
                    alert(res.message || "Booking deleted successfully");
                    row.remove(); // remove row from table
                },
                error: function (xhr) {
                    alert(xhr.responseText || "Failed to cancel booking");
                }
            });
        });
    }
</script>
</body>
</html>
