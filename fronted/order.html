<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Order Form</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: url('Assets/images/drinks-glasses-new-year-eve-celebration.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .order-form-container {
            max-width: 500px;
            height: auto;           /* Auto height based on content */

            margin: 50px auto;
            background: rgba(255, 255, 255, 0);
            z-index: 1;

            backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .order-form-container .form-label {
            font-size: 0.9rem; /* Labels ට small font size */
        }
        .form-control {
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
        }

        .order-form-container .form-control,
        .order-form-container .form-select,
        .order-form-container textarea {
            font-size: 0.9rem; /* Inputs and select reduce font size */
            padding: 10px 10px; /* Reduce padding */
        }

        .order-form-container h2 {
            font-size: 1.4rem; /* Title smaller */
        }

        .order-form-container .btn {
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        .payment-modal .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: none;
        }

        .payment-method-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
        }

        .payment-method-card:hover {
            border-color: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }

        .payment-method-card.selected {
            border-color: #e67e22;
            background: rgba(230, 126, 34, 0.1);
        }

        .payment-method-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #e67e22;
        }

        .order-summary {
            background: rgba(52, 152, 219, 0.1);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .total-amount {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e67e22;
        }

        .card-input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .card-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px 15px;
            width: 100%;
            font-size: 1rem;
        }

        .card-input:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
        }

        .payment-success {
            text-align: center;
            padding: 2rem;
        }

        .payment-success-icon {
            font-size: 4rem;
            color: #27ae60;
            margin-bottom: 1rem;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="order-form-container">
        <h2 class="text-center mb-4">Create New Order</h2>
        <form id="orderForm">

            <!-- Customer ID & Order Type -->
            <div class="row mb-3 g-3">
                <div class="col-md-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your Email" required>
                </div>
                <div class="col-md-6">
                    <label for="qty" class="form-label">Order Qty</label>
                    <input type="number" class="form-control" placeholder="Qty" id="qty" required>
                </div>
                <div class="col-md-6">
                    <label for="orderType" class="form-label">Order Type</label>
                    <select class="form-select" id="orderType" required>
                        <option value="" disabled selected>Select order type</option>
                        <option value="Dine-in">Dine-in</option>
                        <option value="Takeaway">Takeaway</option>
                        <option value="Delivery">Delivery</option>
                    </select>
                </div>
            </div>

            <!-- Order Datetime & Status -->
            <div class="row mb-3 g-3">
                <div class="col-md-6">
                    <label for="orderDatetime" class="form-label">Order Date</label>
                    <input type="date" class="form-control" id="orderDatetime" required>
                </div>
                <div class="col-md-6">
                    <input type="hidden" id="status" value="Pending">
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-flex justify-content-between">
                <button type="button" id="orderSave" class="btn  btn-sm w-100 mx-1 text-white" style="background: #e67e22">Submit Order</button>
                <a href="payment.html"><button type="button" id="payment" class="btn btn-sm w-100 mx-1 text-white" style="background: #e67e22;">Payment</button></a>
            </div>
        </form>
    </div>
</div>


<!-- Orders Modal -->
<div class="modal fade" id="ordersModal" tabindex="-1" aria-labelledby="ordersModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="ordersModalLabel">My Orders</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Item</th>
                        <th>Qty</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Total</th>
                        <th>Date</th>
                    </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
