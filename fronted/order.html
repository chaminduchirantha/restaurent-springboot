<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Order Form</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: url('Assets/images/drinks-glasses-new-year-eve-celebration.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .order-form-container {
            max-width: 700px;
            height: auto;           /* Auto height based on content */

            margin: 50px auto;
            background: rgba(255, 255, 255, 0);
            z-index: 1;

            backdrop-filter: blur(22px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .order-form-container .form-label {
            font-size: 0.9rem; /* Labels ට small font size */
        }

        .order-form-container .form-control,
        .order-form-container .form-select,
        .order-form-container textarea {
            font-size: 0.9rem; /* Inputs and select reduce font size */
            padding: 6px 10px; /* Reduce padding */
        }

        .order-form-container h2 {
            font-size: 1.4rem; /* Title smaller */
        }

        .order-form-container .btn {
            padding: 6px 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="order-form-container">
        <h2 class="text-center mb-4">Create New Order</h2>
        <form id="orderForm">

            <!-- Customer ID & Order Type -->
            <div class="row mb-3 g-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your Email" required>
                </div>
                <div class="col-md-6">
                    <label for="qty" class="form-label">Order Qty</label>
                    <input type="number" class="form-control" placeholder="Qty" id="qty" required>
                </div>
                <div class="col-md-6">
                    <label for="orderType" class="form-label">Order Type</label>
                    <select class="form-select" id="orderType" required>
                        <option value="" disabled selected>Select order type</option>
                        <option value="Dine-in">Dine-in</option>
                        <option value="Takeaway">Takeaway</option>
                        <option value="Delivery">Delivery</option>
                    </select>
                </div>
            </div>

            <!-- Order Datetime & Status -->
            <div class="row mb-3 g-3">
                <div class="col-md-6">
                    <label for="orderDatetime" class="form-label">Order Date</label>
                    <input type="date" class="form-control" id="orderDatetime" required>
                </div>
                <div class="col-md-6">
                    <label for="status" class="form-label">Status</label>
                    <input type="text" class="form-control" id="status" placeholder="e.g., Pending, Completed, Cancelled" required>
                </div>
            </div>

            <!-- Notes -->
            <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" rows="3" placeholder="Add any special instructions or comments"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2 mt-4">
                <button type="button" id="orderSave" class="btn btn-primary">Submit Order</button>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
