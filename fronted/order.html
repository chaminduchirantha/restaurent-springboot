<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Order Form</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      /*display: none;*/
    }
    .order-form-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="order-form-container">
    <h2 class="text-center mb-4">Create New Order</h2>
    <form id="orderForm">
      <!-- Order ID (optional, might be auto-generated on backend) -->
      <div class="mb-3">
        <label for="orderId" class="form-label">Order ID</label>
        <input type="text" class="form-control" id="orderId" placeholder="Auto-generated" readonly>
      </div>

      <!-- Customer ID & Order Type -->
      <div class="row mb-3 g-3">
        <div class="col-md-6">
          <label for="customerId" class="form-label">Customer ID</label>
          <input type="number" class="form-control" id="customerId" required>
        </div>
        <div class="col-md-6">
          <label for="orderType" class="form-label">Order Type</label>
          <select class="form-select" id="orderType" required>
            <option value="" disabled selected>Select order type</option>
            <option value="Dine-in">Dine-in</option>
            <option value="Takeaway">Takeaway</option>
            <option value="Delivery">Delivery</option>
          </select>
        </div>
      </div>

      <!-- Order Datetime & Status -->
      <div class="row mb-3 g-3">
        <div class="col-md-6">
          <label for="orderDatetime" class="form-label">Order Date & Time</label>
          <input type="datetime-local" class="form-control" id="orderDatetime" required>
        </div>
        <div class="col-md-6">
          <label for="status" class="form-label">Status</label>
          <input type="text" class="form-control" id="status" placeholder="e.g., Pending, Completed, Cancelled" required>
        </div>
      </div>

      <!-- Notes -->
      <div class="mb-3">
        <label for="notes" class="form-label">Notes</label>
        <textarea class="form-control" id="notes" rows="3" placeholder="Add any special instructions or comments"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Submit Order</button>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const token = localStorage.getItem("token");

  // Page load unaama token check
  if (!token) {
    window.location.href = "signInPage.html"; // Token naththam login ekata redirect
  } else {
    // Load logged-in user info
    $.ajax({
      url: "http://localhost:8080/role/api/user-info",
      type: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(user) {
        // Username + role display karanna
        $(".order-form-container").prepend(`
        <div class="alert alert-info mb-3">
          👋 Welcome, <b>${user.username}</b> (${user.role})
        </div>
      `);

        // Auto-fill customerId with username (if required)
        $("#customerId").val(user.username);
        $("#customerId").prop("readonly", true);
      },
      error: function(err) {
        console.error("User info load error:", err);
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }
    });
  }


  // Token check
  if (!token) {
    window.location.href = "signInPage.html";
  }

  $("#orderForm").on("submit", function (e) {
    e.preventDefault();

    // Collect form data
    const orderData = {
      orderId: $("#orderId").val() || null, // auto-generated
      customer: {
        customerId: $("#customerId").val()
      },
      orderType: $("#orderType").val(),
      orderDatetime: $("#orderDatetime").val(),
      status: $("#status").val(),
      notes: $("#notes").val()
    };

    // Send AJAX POST request
    $.ajax({
      url: "http://localhost:8080/api/v1/orders/place",
      type: "POST",
      contentType: "application/json",
      headers: { "Authorization": "Bearer " + token },
      data: JSON.stringify(orderData),
      success: function (res) {
        alert(res.message);
        console.log("Order saved:", res.data);

        // Reset form after success
        $("#orderForm")[0].reset();
      },
      error: function (xhr) {
        console.error("Order save failed:", xhr);
        alert("Error placing order!");
      }
    });
  });

</script>
</body>
</html>
